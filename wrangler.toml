name = "resume-tailor"
main = "worker.mjs"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat_v2"]

# Run discovery negotiation before serving the overlaid Astro homepage. The
# Worker still short-circuits ordinary anonymous GET / requests to ASSETS, so
# HTML stays asset-backed while Accept: text/markdown reaches the curated brief.
assets = { directory = ".open-next/assets", binding = "ASSETS", run_worker_first = true }

routes = [
  { pattern = "rolepatch.com/*", zone_name = "rolepatch.com" },
  { pattern = "www.rolepatch.com/*", zone_name = "rolepatch.com" }
]

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[ai]
binding = "AI"

# Build-only environment used while materializing the static-assets cache.
# AI is intentionally absent because cache population never calls a model.
[env.cache]

[triggers]
crons = [
  # Hourly company-watch job discovery sync.
  "0 * * * *",
  # Weekly saved-search/apply-agent digest.
  "0 14 * * 1"
]

[[d1_databases]]
binding = "DB"
database_name = "rolepatch"
database_id = "6d29da06-bc98-44e0-b0b4-a2fc56c61226"

[vars]
TURNSTILE_HOSTNAMES = "rolepatch.com,www.rolepatch.com"
NODE_ENV = "production"
BETTER_AUTH_URL = "https://rolepatch.com"

# Browser Rendering binding — replaces broken puppeteer-core + @sparticuz/chromium.
# Available on Workers Paid plan. Used by src/lib/pdf.ts renderPdf().
[browser]
binding = "BROWSER"
